[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpt-image-cookbook"
version = "0.1.0"
description = "Multi-provider AI image generation cookbook: prompt gallery, agentic skill, and CLI for OpenAI, Google Imagen, Flux, and more."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Eugeniu Ghelbur", email = "eugeniu.ghelbur@singlegrain.com" },
]
keywords = [
  "image-generation",
  "ai-image",
  "openai",
  "gpt-image",
  "imagen",
  "flux",
  "prompt-library",
  "prompt-gallery",
  "agent-skill",
  "claude-code",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/eugeniughelbur/gpt-image-cookbook"
Repository = "https://github.com/eugeniughelbur/gpt-image-cookbook"
Issues = "https://github.com/eugeniughelbur/gpt-image-cookbook/issues"

[project.scripts]
gic = "gic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gic"]
